# nginx.conf
worker_processes 1;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    
    # Агрессивное сжатие для HTML/JSON/CSS/JS
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";
    
    # Кэш открытых файлов (важно для роутера!)
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    
    # Не отдаём информацию о сервере
    server_tokens off;

    # Отключить всё лишнее для экономии CPU
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio off;  # На роутере без нормального AIO

    keepalive_timeout 30;
    keepalive_requests 50;
    
    server {
        listen 80;
        
        # Корень с красивыми URL
        root /usr/share/nginx/html;
        index index.html;

        location ~* \.html$ {
            expires 10m;
            add_header Cache-Control "public, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # CSS и JS — долгий кэш (можно пересобрать с версией в имени)
        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }
        
        # Бесконечный кэш для изображений с версионированием
        location /thumbs/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location /full/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /raw/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Шрифты если будут
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # Картинки и фавикон
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Запрет доступа к скрытым файлам
        location ~ /\. {
            deny all;
            access_log off;
        }
    }
}
