# docker-compose.yml
version: '3.8'

services:
  gallery:
    image: nginx:alpine
    container_name: gallery
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro  # :ro = read-only
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # Ограничиваем ресурсы для роутера
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    # Логи в tmpfs чтобы не убивать флешку
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    tmpfs:
      - /var/cache/nginx
      - /var/log/nginx
